<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abelhas 3D</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js" integrity="sha384-sr9b4Ux0WhAUGclJ0ym0FSY2zSOMmNSn0bP/SA0e6bNCrpn/5W3QL8mm+LdlQMKw" crossorigin="anonymous"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #1b1a17; color: #f3ede0; }
  h1 { text-align: center; font-weight: 600; margin: 32px 16px 8px; }
  p.hint { text-align: center; opacity: .7; margin: 0 16px 24px; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 0 16px 32px; max-width: 1400px; margin: auto; }
  figure { margin: 0; background: #2a2823; border-radius: 12px; overflow: hidden; }
  model-viewer { width: 100%; height: 420px; background: radial-gradient(#3a372f, #22201b); }
  figcaption { padding: 12px 16px; font-size: 1.1rem; }
</style>
</head>
<body>
<h1>Abelhas 3D</h1>
<p class="hint">Arraste para girar · role ou pince para dar zoom</p>
<main>
  <figure>
    <model-viewer src="jatai.glb" alt="Modelo 3D da abelha jataí" camera-controls auto-rotate shadow-intensity="1"></model-viewer>
    <figcaption>Jataí</figcaption>
  </figure>
  <figure>
    <model-viewer src="mamangava.glb" alt="Modelo 3D da mamangava" camera-controls auto-rotate shadow-intensity="1"></model-viewer>
    <figcaption>Mamangava</figcaption>
  </figure>
  <figure>
    <model-viewer src="europeia.glb" alt="Modelo 3D da abelha europeia" camera-controls auto-rotate shadow-intensity="1"></model-viewer>
    <figcaption>Abelha europeia</figcaption>
  </figure>
</main>
</body>
</html>
