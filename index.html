<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abelhas 3D</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js" integrity="sha384-sr9b4Ux0WhAUGclJ0ym0FSY2zSOMmNSn0bP/SA0e6bNCrpn/5W3QL8mm+LdlQMKw" crossorigin="anonymous"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #1b1a17; color: #f3ede0; }
  a { color: inherit; }
  h1 { text-align: center; font-weight: 600; margin: 24px 16px 8px; }
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 16px 8px; }
  nav a { text-decoration: none; padding: 6px 14px; border-radius: 999px; background: #2a2823; }
  nav a[aria-current="page"] { background: #e8b84a; color: #1b1a17; }
  p.hint { text-align: center; opacity: .7; margin: 8px 16px 20px; }
  [hidden] { display: none !important; }
  model-viewer { width: 100%; background: radial-gradient(#3a372f, #22201b); }

  #grupo { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 0 16px 32px; max-width: 1400px; margin: auto; }
  figure { margin: 0; background: #2a2823; border-radius: 12px; overflow: hidden; }
  #grupo model-viewer { height: 420px; }
  figcaption { padding: 12px 16px; font-size: 1.1rem; display: flex; justify-content: space-between; }

  #individual { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; padding: 0 16px 32px; max-width: 1600px; margin: auto; }
  #individual model-viewer { height: 75vh; border-radius: 12px; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: 1.1rem; opacity: .8; }
  #plain { position: absolute; top: 12px; right: 12px; padding: 6px 12px; border: 0; border-radius: 999px; background: #2a2823; color: inherit; font: inherit; font-size: .9rem; cursor: pointer; }
  #plain[aria-pressed="true"] { background: #e8b84a; color: #1b1a17; }
  #refs { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #refs > img { width: 100%; height: calc(75vh - 96px); object-fit: contain; background: #2a2823; border-radius: 12px; }
  #thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  #thumbs button { flex: none; padding: 0; border: 2px solid transparent; border-radius: 8px; background: none; cursor: pointer; }
  #thumbs button[aria-pressed="true"] { border-color: #e8b84a; }
  #thumbs img { display: block; width: 80px; height: 72px; object-fit: cover; border-radius: 6px; }
  #semref { margin: auto; opacity: .7; }
  @media (max-width: 800px) {
    #individual { grid-template-columns: 1fr; }
    #individual model-viewer { height: 60vh; }
    #refs > img { height: 50vh; }
  }
</style>
</head>
<body>
<h1>Abelhas 3D</h1>
<nav>
  <a href="#grupo">Grupo</a>
  <a href="#jatai">Jataí</a>
  <a href="#mamangava">Mamangava</a>
  <a href="#europeia">Europeia</a>
</nav>
<p class="hint">Arraste para girar · role ou pince para dar zoom</p>

<main id="grupo">
  <figure>
    <model-viewer src="jatai.glb" alt="Modelo 3D da abelha jataí" camera-controls auto-rotate shadow-intensity="1"><div class="loading" role="status">Carregando…</div></model-viewer>
    <figcaption>Jataí <a href="#jatai">Ver individual →</a></figcaption>
  </figure>
  <figure>
    <model-viewer src="mamangava.glb" alt="Modelo 3D da mamangava" camera-controls auto-rotate shadow-intensity="1"><div class="loading" role="status">Carregando…</div></model-viewer>
    <figcaption>Mamangava <a href="#mamangava">Ver individual →</a></figcaption>
  </figure>
  <figure>
    <model-viewer src="europeia.glb" alt="Modelo 3D da abelha europeia" camera-controls auto-rotate shadow-intensity="1"><div class="loading" role="status">Carregando…</div></model-viewer>
    <figcaption>Abelha europeia <a href="#europeia">Ver individual →</a></figcaption>
  </figure>
</main>

<main id="individual" hidden>
  <model-viewer id="mv" camera-controls shadow-intensity="1">
    <div class="loading" role="status">Carregando…</div>
    <button id="plain" aria-pressed="false" title="Ver só a forma, como numa impressão 3D">Sem textura</button>
  </model-viewer>
  <section id="refs" aria-label="Referências">
    <img id="big" alt="">
    <div id="thumbs"></div>
    <p id="semref" hidden>Sem imagens de referência para esta abelha.</p>
  </section>
</main>

<script>
  // number of images in refs/<bee>-N.webp
  const BEES = {
    jatai: { name: 'Jataí', refs: 9 },
    mamangava: { name: 'Mamangava', refs: 12 },
    europeia: { name: 'Abelha europeia', refs: 1 },
  };
  const $ = id => document.getElementById(id);

  function show(i, bee) {
    $('big').src = `refs/${bee}-${i}.webp`;
    $('big').alt = `Referência ${i} da ${BEES[bee].name}`;
    for (const b of $('thumbs').children) b.setAttribute('aria-pressed', b.dataset.i == i);
  }

  function route() {
    const bee = location.hash.slice(1);
    const info = BEES[bee];
    $('grupo').hidden = !!info;
    $('individual').hidden = !info;
    for (const a of document.querySelectorAll('nav a')) {
      if (a.getAttribute('href') === '#' + (info ? bee : 'grupo')) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    }
    if (!info) return;
    // attributes, not properties: this can run before <model-viewer> is defined
    if ($('mv').getAttribute('src') !== `${bee}.glb`) $('mv').querySelector('.loading').hidden = false;
    $('mv').setAttribute('src', `${bee}.glb`);
    $('mv').setAttribute('alt', `Modelo 3D da ${info.name}`);
    $('thumbs').innerHTML = '';
    for (let i = 1; i <= info.refs; i++) {
      const b = document.createElement('button');
      b.dataset.i = i;
      b.innerHTML = `<img src="refs/${bee}-${i}.webp" alt="Referência ${i}" loading="lazy">`;
      b.onclick = () => show(i, bee);
      $('thumbs').append(b);
    }
    $('big').hidden = $('thumbs').hidden = !info.refs;
    $('semref').hidden = !!info.refs;
    if (info.refs) show(1, bee);
  }
  // "Sem textura": plain matte grey, no maps, opaque wings — only the geometry, like a print.
  // Originals are saved per model load so the button can switch back.
  let originals = null;
  function applyPlain() {
    const plain = $('plain').getAttribute('aria-pressed') === 'true';
    const mats = $('mv').model?.materials ?? [];
    if (!originals) originals = mats.map(m => {
      const p = m.pbrMetallicRoughness;
      return { color: p.baseColorFactor, metal: p.metallicFactor, rough: p.roughnessFactor, alpha: m.getAlphaMode(), ior: m.ior,
               tex: [p.baseColorTexture, p.metallicRoughnessTexture, m.normalTexture, m.occlusionTexture, m.emissiveTexture,
                     m.specularColorTexture].map(t => [t, t.texture]) };
    });
    mats.forEach((m, i) => {
      const o = originals[i], p = m.pbrMetallicRoughness;
      for (const [t, tex] of o.tex) t.setTexture(plain ? null : tex);
      m.setIor(plain ? 1.5 : o.ior);  // the exports carry ior 1000 (near-mirror); plastic is ~1.5
      p.setBaseColorFactor(plain ? [0.4, 0.4, 0.4, 1] : o.color);
      p.setMetallicFactor(plain ? 0 : o.metal);
      p.setRoughnessFactor(plain ? 0.6 : o.rough);
      m.setAlphaMode(plain ? 'OPAQUE' : o.alpha);
    });
  }
  $('plain').onclick = () => {
    $('plain').setAttribute('aria-pressed', $('plain').getAttribute('aria-pressed') !== 'true');
    applyPlain();
  };
  $('mv').addEventListener('load', () => { originals = null; applyPlain(); });  // new bee keeps the chosen mode

  // "Carregando…" until each model is ready, with download progress
  for (const m of document.querySelectorAll('model-viewer')) {
    const msg = m.querySelector('.loading');
    m.addEventListener('progress', e => { msg.textContent = `Carregando… ${Math.round(e.detail.totalProgress * 100)}%`; });
    m.addEventListener('load', () => { msg.hidden = true; });
    m.addEventListener('error', () => { msg.textContent = 'Não foi possível carregar o modelo.'; });
  }

  addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
